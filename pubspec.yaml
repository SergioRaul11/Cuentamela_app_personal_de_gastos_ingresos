name: cuentamela
description: "Cuéntamela — finanzas personales conversacionales con Flutter, Riverpod y Hive."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localización en español (selector de fechas y textos de Material).
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Estado reactivo e inyección de dependencias.
  flutter_riverpod: ^2.5.1

  # Persistencia local offline (cajas: userBox, transactionsBox, goalsBox).
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Generación de adaptadores Hive (ver README: los .g.dart ya vienen escritos).
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
